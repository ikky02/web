<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Web Afrizal - Login</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://images.unsplash.com/photo-1519125323398-675f0ddb6308') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .box {
      background: rgba(0, 0, 0, 0.75);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
    }

    input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    input {
      background-color: #eee;
    }

    button {
      background-color: #3498db;
      color: white;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .game-box {
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    #clickBtn {
      padding: 15px 30px;
      font-size: 20px;
      background-color: #2ecc71;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #startBtn {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="box" id="loginBox">
    <h2>Web Afrizal</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="alert('Maaf program belum di buat')">Sign Up</button>
    <button onclick="alert('Maaf program belum di buat')">Forgot Password</button>
  </div>

  <div class="game-box hidden" id="gameBox">
    <h2>Game Kecepatan Tangan</h2>
    <p>Klik tombol hijau secepat mungkin saat muncul!</p>
    <button id="startBtn" onclick="startGame()">Mulai Game</button>
    <br><br>
    <button id="clickBtn" class="hidden" onclick="endGame()">Klik Saya!</button>
    <p id="resultText"></p>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === "MieAyamEnak" && pass === "mamah aku takut") {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("gameBox").classList.remove("hidden");
      } else {
        alert("Username atau Password salah!");
      }
    }

    let startTime;

    function startGame() {
      document.getElementById("resultText").innerText = "";
      document.getElementById("clickBtn").classList.add("hidden");

      const delay = Math.floor(Math.random() * 3000) + 1000; // antara 1-4 detik
      setTimeout(() => {
        document.getElementById("clickBtn").classList.remove("hidden");
        startTime = new Date().getTime();
      }, delay);
    }

    function endGame() {
      const endTime = new Date().getTime();
      const reactionTime = (endTime - startTime) / 1000;
      document.getElementById("resultText").innerText = `Waktu reaksi kamu: ${reactionTime} detik`;
      document.getElementById("clickBtn").classList.add("hidden");
    }
  </script>

</body>
</html>
